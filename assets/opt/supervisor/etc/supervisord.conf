[unix_http_server]
file=__TARGET__/opt/supervisor/run/supervisor.sock
chmod=0700

[supervisord]
logfile=__TARGET__/opt/supervisor/log/supervisord.log
logfile_maxbytes=2MB
logfile_backups=2
loglevel=info
pidfile=__TARGET__/opt/supervisor/run/supervisord.pid
childlogdir=__TARGET__/opt/supervisor/log
nodaemon=false
minfds=1024
minprocs=400

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://__TARGET__/opt/supervisor/run/supervisor.sock

[include]
files = __TARGET__/opt/supervisor/etc/conf.d/*.conf
