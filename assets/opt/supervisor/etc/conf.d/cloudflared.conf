; Cloudflare named tunnel (fixed domain). ensure.sh still acts as fallback if supervisord is down.
[program:cloudflared]
command=__TARGET__/opt/cloudflared/bin/cloudflared --no-autoupdate tunnel --config __TARGET__/.cloudflared/config.yml run
priority=45
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=__TARGET__/opt/mintpanel/cf-named.log
redirect_stderr=true
