; desktop stack managed by supervisord -- the single owner of every long-lived process
; priority: xvfb 10 (also sets the wallpaper once) -> openbox 20 -> tint2 30 -> x11vnc/websockify 40 -> healthcheck 50

[program:xvfb]
command=__TARGET__/opt/supervisor/bin/xvfb-run.sh
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=8
stdout_logfile=__TARGET__/opt/desktop/logs/xvfb.log
redirect_stderr=true

[program:openbox]
command=__TARGET__/opt/desktop/bin/openbox --config-file __TARGET__/opt/desktop/etc/xdg/openbox/rc.xml
environment=DISPLAY=":99",LD_LIBRARY_PATH="__TARGET__/opt/desktop/lib",XDG_CONFIG_HOME="__TARGET__/opt/desktop/etc/xdg",XDG_DATA_DIRS="__TARGET__/.local/share:__TARGET__/opt/desktop/share:/usr/local/share:/usr/share",FONTCONFIG_PATH="__TARGET__/opt/desktop/etc/fonts",FONTCONFIG_FILE="__TARGET__/opt/desktop/etc/fonts/fonts.conf",PATH="__TARGET__/opt/desktop/bin:/usr/local/bin:/usr/bin:/bin"
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=__TARGET__/opt/desktop/logs/openbox.log
redirect_stderr=true

[program:tint2]
command=__TARGET__/opt/desktop/bin/tint2 -c __TARGET__/opt/desktop/etc/xdg/tint2/tint2rc
environment=DISPLAY=":99",LD_LIBRARY_PATH="__TARGET__/opt/desktop/lib",XDG_CONFIG_HOME="__TARGET__/opt/desktop/etc/xdg",PATH="__TARGET__/opt/desktop/bin:/usr/local/bin:/usr/bin:/bin"
priority=30
autostart=true
autorestart=true
startsecs=2
stdout_logfile=__TARGET__/opt/desktop/logs/tint2.log
redirect_stderr=true

[program:x11vnc]
; -rfbport 0 + -unixsock: no TCP listener at all. This build ignores -no6 / -rfbportv6 / -allow,
; so a TCP port 5900 would also be reachable on the container's ULA address from neighbouring
; containers. With a unix socket only websockify (same uid, same filesystem) can reach it, and
; no VNC password is needed. The socket is reached through the panel's authenticated /novnc.
command=__TARGET__/opt/desktop/bin/x11vnc -display :99 -forever -shared -rfbport 0 -unixsock __TARGET__/.vnc/vnc.sock
environment=DISPLAY=":99",LD_LIBRARY_PATH="__TARGET__/opt/desktop/lib",PATH="__TARGET__/opt/desktop/bin:/usr/local/bin:/usr/bin:/bin"
priority=40
autostart=true
autorestart=true
startsecs=2
stopsignal=KILL
stopwaitsecs=3
stdout_logfile=__TARGET__/opt/desktop/logs/x11vnc.log
redirect_stderr=true

[program:websockify]
command=/usr/local/bin/python3 -m websockify --web __TARGET__/opt/desktop/share/novnc 127.0.0.1:6080 127.0.0.1:5900
environment=PYTHONPATH="__TARGET__/opt/desktop/lib/python3/dist-packages",PATH="/usr/local/bin:/usr/bin:/bin"
priority=40
autostart=true
autorestart=true
startsecs=3
stdout_logfile=__TARGET__/opt/desktop/logs/websockify.log
redirect_stderr=true

[program:healthcheck]
command=__TARGET__/opt/supervisor/bin/healthcheck.sh
priority=50
autostart=true
autorestart=true
startsecs=1
stdout_logfile=__TARGET__/opt/supervisor/log/healthcheck.log
redirect_stderr=true
